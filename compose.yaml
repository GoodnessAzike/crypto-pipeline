services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: crypto
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "crypto"]
      interval: 2s
      timeout: 5s
      retries: 10
    
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:pw@db:5432/crypto
    volumes: 
      - ./raw:/app/raw
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: