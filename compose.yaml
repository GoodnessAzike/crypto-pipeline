services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "crypto"]
      interval: 2s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: python migrate.py
    environment: 
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crypto
    depends_on:
      db:
        condition: service_healthy
    
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crypto
    volumes: 
      - ./raw:/app/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata: